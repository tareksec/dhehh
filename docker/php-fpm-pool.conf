; Loaded after the image's own pool files (the "zzz" prefix keeps it last).
[www]
user = www-data
group = www-data

; Only nginx in this container talks to PHP-FPM.
listen = 127.0.0.1:9000

; Coolify passes the app's settings as container environment variables.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Workers are recycled now and then so nothing lives on for days.
pm.max_requests = 500
request_terminate_timeout = 120s
