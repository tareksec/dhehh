# Plain-nginx version of nginx.template.conf (which only Nixpacks can render).
# __PORT__ is replaced with $PORT (default 80) when the container starts.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    server_names_hash_bucket_size 128;

    # Supports the app's largest Filament field (a 10 MB voucher) plus
    # multipart overhead. Individual fields still enforce their own limits.
    client_max_body_size 16M;
    client_body_timeout 120s;

    # More headroom than nginx's 75s for the Android app's WebView and for
    # the Coolify / Traefik proxy in front (see CHANGELOG [1.8.1]).
    keepalive_timeout 120s;

    server {
        listen __PORT__;
        listen [::]:__PORT__;
        server_name localhost;

        root /app/public;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        # There is deliberately no "location = /robots.txt" block: robots.txt
        # is a Laravel route that answers per domain.

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;

            # PHP-FPM defaults can be smaller than Filament's 2 MB image and
            # 10 MB voucher field limits. These directives are PHP_INI_PERDIR
            # values, applied only to requests served by this application.
            fastcgi_param PHP_VALUE "upload_max_filesize=12M\npost_max_size=16M\nmax_execution_time=120\nmax_input_time=120";
            fastcgi_read_timeout 120s;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
