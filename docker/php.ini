; Overrides on top of php.ini-production for the production image.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 16M
max_execution_time = 120
max_input_time = 120

; PHP security advisory of 2026-10-21 (CVE-2026-109619): the upload-progress
; feature is not used by Laravel and is one way to reach the stale-state bug.
session.upload_progress.enabled = 0

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
