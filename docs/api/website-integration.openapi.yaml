openapi: 3.0.3
info:
  title: ZamZam ERP — Website Integration API
  version: "1.0.0"
  description: >
    Server-to-server API for a company's external website to sync
    products/stock, submit orders and inquiries, and read order status.
    Import this file directly into Postman (File → Import) or any Swagger UI.
servers:
  - url: https://your-erp-domain.example/api/v1
    description: Production
  - url: https://staging.your-erp-domain.example/api/v1
    description: Staging (see staging-setup.md)

security:
  - bearerAuth: []

paths:
  /products:
    get:
      summary: List active products
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      summary: Create a product from the website
      description: >
        Image URLs are downloaded into the ERP's own storage. No
        product.created webhook is sent back to the website that created it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ProductWrite"
                - type: object
                  required: [sku, name, price]
                  properties:
                    sku: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
                  failed_images:
                    type: array
                    items: { type: string }
        "409": { description: "A product with this SKU already exists (error: sku_exists)" }
        "422": { description: Validation failed }

  /products/{sku}:
    get:
      summary: Get a single product by SKU
      parameters:
        - $ref: "#/components/parameters/Sku"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
        "404": { description: No product with that SKU }
    patch:
      summary: Update any product field (price, sale price, stock, name, images ...)
      description: >
        `stock` is a target value, not a delta. On our side it is reconciled
        as a StockMovement ledger entry (an auditable adjustment), never a
        raw overwrite — you don't need to do anything differently for that,
        just send the number your dashboard shows. Send `images` only when the
        photos changed.
      parameters:
        - $ref: "#/components/parameters/Sku"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ProductWrite"
                - type: object
                  minProperties: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
                  failed_images:
                    type: array
                    description: Present only when an image URL could not be downloaded.
                    items: { type: string }
        "422": { description: No fields provided, or validation failed }
        "404": { description: No product with that SKU }

  /orders:
    post:
      summary: Create an order from the website
      description: >
        Idempotent on `external_reference` — re-posting the same value
        returns the existing order instead of creating a duplicate, so a
        retried request after a timeout is always safe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "200":
          description: Already existed (idempotent replay)
        "422": { description: Validation failed, or an item SKU was not found }

  /orders/{order_number}:
    get:
      summary: Read an order's current status
      description: >
        A fallback/polling option — the primary mechanism is the
        `order.status_updated` webhook (see below).
      parameters:
        - name: order_number
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "404": { description: No order with that number }

  /leads:
    post:
      summary: Submit a website inquiry
      description: >
        Lands in the ERP CRM's lead/query list with source "website". Send
        your own quote id as `external_reference`: re-posting the same value
        returns the existing lead (200) instead of creating a duplicate, and
        the `lead.status_updated` webhook echoes it back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                external_reference:
                  type: string
                  nullable: true
                  maxLength: 190
                  description: Your own quote/inquiry id — used for idempotency and status webhooks.
                name: { type: string }
                phone: { type: string }
                email: { type: string, format: email, nullable: true }
                interest: { type: string, nullable: true }
                note: { type: string, nullable: true }
      responses:
        "200":
          description: A lead with this external_reference already exists — returned unchanged.
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      external_reference: { type: string, nullable: true }
                      status:
                        type: string
                        enum: [new, contacted, quoted, won, lost]
                      created_at: { type: string, format: date-time }
        "422": { description: Validation failed }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Generate a key from ZamZam ERP → Settings → Integrations → Website
        API. Send it as `Authorization: Bearer <token>`. Each key is scoped
        to exactly one company — you never need to send a company id
        separately.
  parameters:
    Sku:
      name: sku
      in: path
      required: true
      schema: { type: string }
  schemas:
    PageMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        total: { type: integer }
    Specification:
      type: object
      properties:
        label: { type: string }
        value: { type: string }
    Product:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        slug: { type: string }
        brand: { type: string, nullable: true }
        category:
          type: object
          nullable: true
          properties:
            name: { type: string }
            slug: { type: string }
        description: { type: string, nullable: true, description: HTML }
        specifications:
          type: array
          items: { $ref: "#/components/schemas/Specification" }
        price: { type: number }
        sale_price: { type: number, nullable: true }
        stock: { type: integer }
        is_active: { type: boolean }
        status: { type: string, enum: [available, coming_soon] }
        image: { type: string, format: uri, nullable: true }
        images:
          type: array
          description: Featured image first, then the gallery.
          items: { type: string, format: uri }
        updated_at: { type: string, format: date-time }
    ProductWrite:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        price: { type: number, minimum: 0 }
        sale_price: { type: number, nullable: true, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        brand: { type: string, nullable: true }
        category: { type: string, nullable: true, description: Category name; created when missing }
        description: { type: string, nullable: true }
        specifications:
          type: array
          items: { $ref: "#/components/schemas/Specification" }
        images:
          type: array
          maxItems: 11
          items: { type: string, format: uri }
        is_active: { type: boolean }
        status: { type: string, enum: [available, coming_soon] }
    OrderCreateRequest:
      type: object
      required: [external_reference, customer, items]
      properties:
        external_reference:
          type: string
          description: Your own order id/number — used for idempotency.
        customer:
          type: object
          required: [name, phone, address]
          properties:
            name: { type: string }
            phone: { type: string }
            email: { type: string, format: email, nullable: true }
            address: { type: string }
        note: { type: string, nullable: true }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: { type: string }
              quantity: { type: integer, minimum: 1 }
              unit_price:
                type: number
                nullable: true
                description: Defaults to the product's current selling price if omitted.
    Order:
      type: object
      properties:
        order_number: { type: string }
        external_reference: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, confirmed, processing, completed, cancelled, returned, refunded]
        delivery_status: { type: string }
        workflow_stage: { type: string }
        total_amount: { type: number }
        due_amount: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

x-webhooks-note: >
  ZamZam ERP also PUSHES events to a webhook URL you configure (Settings →
  Integrations → Website API → Webhook delivery URL). Events: "order.status_updated"
  (fired whenever an order's status or delivery status changes — one-way,
  ERP to website only), "product.created" / "product.updated" (the full
  Product above plus changed_fields, the fields that change touched),
  "product.deleted" (sku, name, deleted_at), and "lead.status_updated" (a lead you submitted with an
  external_reference changed status — data: id, external_reference, status,
  updated_at). Every delivery is a POST with header
  "X-ZamZam-Signature: hash_hmac('sha256', <raw request body>, <your webhook secret>)"
  and a JSON body of {"event": "...", "data": {...}, "timestamp": "..."}. See
  website-integration.md for a verification code sample.
